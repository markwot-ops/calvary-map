<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sidebar highlight preview v4</title>
<style>
  body { margin:0; padding:40px; background:#0a0a0a; font-family:Arial,sans-serif; }
  .col { width:265px; }
  .label { color:#888; font-size:13px; margin-bottom:10px; letter-spacing:0.03em; }
  .sidebar { background:rgba(10,10,10,0.93); border:1px solid #2a2a2a; border-radius:4px; padding:3px 0; }

  .vet-item { padding:8px 11px; cursor:pointer; border-bottom:1px solid #181818; display:flex; align-items:center; gap:7px; font-family:Georgia,serif; }
  .v-sym { font-size:0.85rem; width:15px; text-align:center; flex-shrink:0; }
  .v-name { font-size:0.82rem; color:#d4c9b8; flex:1; }
  .v-era { font-size:0.66rem; color:#777; }

  .vet-item.active {
    background:#000000;
    border-left:3px solid #CD853F;
    padding-left:8px;
  }
  .vet-item.active .v-name {
    color:#ffffff;
    text-shadow:0 0 4px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.5);
  }
  .vet-item.active .v-era {
    color:#ffffff;
    text-shadow:0 0 4px rgba(255,255,255,0.8), 0 0 8px rgba(255,255,255,0.4);
  }
  .vet-item.active .v-sym {
    text-shadow:0 0 4px rgba(255,255,255,0.7);
  }
</style>
</head>
<body>

<div class="col">
  <div class="label">BLACK BG, WHITE GLOW TEXT</div>
  <div class="sidebar">
    <div class="vet-item"><span class="v-sym">⚓</span><span class="v-name">J. Losty</span><span class="v-era">WWII</span></div>
    <div class="vet-item active"><span class="v-sym">✈</span><span class="v-name">L. Concannon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">★</span><span class="v-name">Mary Gordon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">✚</span><span class="v-name">Rev. W. Davitt</span><span class="v-era">WWI</span></div>
  </div>
</div>

</body>
</html>
