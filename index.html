#map { position:absolute; inset:0; z-index:1; }

#legend h4 { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.12em; color:#888; margin-bottom:8px; }
.leg-row { display:flex; align-items:center; gap:7px; margin-bottom:5px; cursor:pointer; transition:opacity 0.15s; }

.leg-sym { width:16px; text-align:center; font-size:0.82rem; }
.leg-label { font-size:0.72rem; color:#ccc; flex:1; }
.leg-count { font-size:0.68rem; color:#ccc; }

#sidebar {
  position:absolute; top:0; right:0; bottom:0; width:265px;
  background:rgba(10,10,10,0.93); border-left:1px solid #2a2a2a;

#era-filters { display:flex; flex-wrap:wrap; gap:3px; }

.era-btn.on { border-color:rgba(255,255,255,0.6); opacity:1; }

#vet-list::-webkit-scrollbar { width:4px; }
#vet-list::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
.vet-item {
  padding:6px 11px; cursor:pointer; border-bottom:1px solid #181818;
  display:flex; align-items:center; gap:7px; transition:background 0.1s;
}
.vet-item:hover { background:#1c1c1c; }
.vet-item.active { background:#1e120a; border-left:3px solid #CD853F; padding-left:8px; }
.v-sym { font-size:0.8rem; width:15px; text-align:center; flex-shrink:0; }
.v-name { font-size:0.78rem; color:#d4c9b8; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v-era { font-size:0.63rem; color:#777; }
#no-results { padding:18px; color:#555; font-size:0.8rem; text-align:center; display:none; }

#pclose {

#pclose:hover { color:#fff; }
#pphoto { width:100%; max-height:200px; object-fit:cover; border-radius:4px; margin-bottom:12px; display:none; }
#pname { font-size:1.05rem; color:#f0e8d8; margin-bottom:3px; }
#pservice { font-size:0.78rem; color:#CD853F; margin-bottom:9px; letter-spacing:0.04em; }
#pstory { font-size:0.78rem; color:#aaa; line-height:1.65; }
#pflags { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }

    "lat": 42.186981,
    "lng": -72.627486,
    "story": "Harold Clark Bugbee served in the United States Navy during World War I, attaining the rate of Machinist's Mate First Class. Machinist's Mates were the engineering backbone of the fleet — responsible for the operation and maintenance of engines, boilers, and mechanical systems that kept warships underway. First Class was a senior petty officer rating, reflecting years of skill and experience. Born November 11, 1892 in Wallingford, Connecticut, Bugbee was a longtime resident of Chicopee before moving to West Springfield, Massachusetts, where he worked as a retired substation operator for the Chicopee Electric Light Company for 36 years. He was a member of American Legion Post 207. He passed away April 6, 1977 at the age of 84 and is buried at Calvary Cemetery. If you have further information about this veteran, please contact the City of Holyoke Veterans Graves Officer at (413) 322-5630 at 310 Appleton Street, 1st Floor, Holyoke, MA 01040.",

    "id": "cahill__j_mass_inf",

    "lat": 42.188525,
    "lng": -72.628028,
    "story": "John W. Cahill served in Company E of the 46th Regiment Massachusetts Volunteer Infantry during the American Civil War, enlisting August 20, 1862 and mustering out July 29, 1863. The 46th was a Hampden County regiment — drawn almost entirely from the men of this region — that answered President Lincoln's 1862 call for 300,000 volunteers. The regiment served in North Carolina and later joined the Army of the Potomac in pursuit of Lee's forces after Gettysburg. Born in 1844 in New York, Cahill settled in Holyoke where he worked as a machinist. He passed away October 17, 1904 at the age of approximately 60. He is survived by a brother Hugh Cahill, a sister Mrs. Unger, and a son Frank, all of Holyoke. His stone is among the oldest veteran markers at Calvary Cemetery. If you have further information about this veteran, please contact the City of Holyoke Veterans Graves Officer at (413) 322-5630 at 310 Appleton Street, 1st Floor, Holyoke, MA 01040.",

    "lat": 42.1883278,
    "lng": -72.6288694,
    "story": "Rev. William Francis Davitt was born in Holyoke on December 8, 1886, and grew up in nearby Chicopee, where he played football before graduating from Holy Cross College in 1907. He entered the priesthood, and was serving at St. Ann's in Lenox when the United States entered World War I in 1917. Commissioned a First Lieutenant, he volunteered as a Knights of Columbus chaplain and was assigned to the 125th Infantry Regiment, 32nd Division, American Expeditionary Forces. On August 6, 1918, during the advance along the Vesle River in France, Chaplain Davitt led a party of volunteers through machine-gun fire to rescue forty American soldiers trapped in a ravine — all were brought back without a single rescuer lost. For this act he was recommended for the Distinguished Service Cross and was awarded the French Croix de Guerre with palm. Father Davitt was killed in action on November 11, 1918, roughly an hour before the Armistice took effect — he is remembered as the last American officer, and the last American chaplain, killed in World War I. His remains were returned to Holyoke in 1921. He is also memorialized on Chaplains Hill at Arlington National Cemetery, and the William F. Davitt Memorial Bridge in Chicopee bears his name. If you have further information about this veteran, please contact the City of Holyoke Veterans Graves Officer at (413) 322-5630 at 310 Appleton Street, 1st Floor, Holyoke, MA 01040.",

    "story": "Timothy Cahill served in the 10th New Hampshire Infantry during the Civil War, enlisting August 7, 1861 and credited to Nashua, NH as a private in Company B before being appointed Hospital Steward on September 12, 1862. He was mustered out for disability on November 10, 1862 at Cliff Mills, Virginia. Born April 14, 1839 in Weare, Hillsborough County, New Hampshire, he passed away March 17, 1914 at the age of 74 in Springfield, Massachusetts. He is buried at Calvary Cemetery. ⚠️ Geo-location TBD — coordinates are placeholder only. If you have further information about this veteran, please contact the City of Holyoke Veterans Graves Officer at (413) 322-5630 at 310 Appleton Street, 1st Floor, Holyoke, MA 01040.",

const ERA_COLORS = {
  'Civil War Era':'#8B4513',
  'Spanish-American War':'#CD853F',
  'World War I':'#4682B4',
  'World War II':'#2E8B57',
  'Korean War':'#9370DB',
  'Vietnam':'#DC143C',
  'Unknown Era':'#666',
};
const ERA_ORDER = ['Civil War Era','Spanish-American War','World War I','World War II','Korean War','Vietnam','Unknown Era'];

function normEra(raw) {
  if (!raw) return 'Unknown Era';
  const s = raw.trim();
  if (s.includes('Civil')) return 'Civil War Era';
  if (s.includes('Spanish')) return 'Spanish-American War';
  if (s.includes('Vietnam')) return 'Vietnam';
  if (s.includes('World War II')) return 'World War II';
  if (s.includes('World War I')) return 'World War I';
  if (s.includes('Korean')) return 'Korean War';
  if (s.includes('Early') || s.includes('Pre-')) return 'World War I';
  return 'Unknown Era';
}

function eraColor(raw) { return ERA_COLORS[normEra(raw)] || '#666'; }

function branchSym(branch) {
  if (!branch) return '✦';
  const b = branch.toUpperCase();
  if (b.includes('NAVY')) return '⚓';
  if (b.includes('MARINE') || b.includes('USMC')) return '🦅';
  if (b.includes('AIR') || b.includes('USAF')) return '✈';
  if (b.includes('COAST')) return '⚑';
  if (b.includes('ARMY')) return '★';
  return '✦';
}

// Map
const map = L.map('map', {preferCanvas:true, minZoom:15, maxZoom:20})
  .setView([42.18855,-72.62910], 17);

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {attribution:'&copy; Esri', maxNativeZoom:19, maxZoom:20}
);
const street = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; CARTO', subdomains:'abcd', maxNativeZoom:19, maxZoom:20}
);
const terrain = L.tileLayer(
  'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenTopoMap', subdomains:'abc', maxNativeZoom:17, maxZoom:20}
);

satellite.addTo(map);
L.control.layers({'Satellite':satellite,'Street':street,'Terrain':terrain},{},{position:'topleft'}).addTo(map);

// State
let activeEras = new Set(ERA_ORDER);
let markerMap = {};
let activeIdx = null;
let searchTerm = '';

// Markers
function buildMarkers() {
  Object.values(markerMap).forEach(m => map.removeLayer(m));
  markerMap = {};
  veterans.forEach((v, idx) => {
    if (!activeEras.has(normEra(v.era))) return;
    if (!v.lat || !v.lng) return;
    const color = eraColor(v.era);
    const sym = branchSym(v.branch);
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:26px;height:26px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.65);display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 5px rgba(0,0,0,0.8);cursor:pointer;">${sym}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    const m = L.marker([v.lat, v.lng], {icon});
    m.on('click', () => {
      // Show coordinate tooltip briefly on the marker
      openPopup(v, idx);
    });
    m.addTo(map);
    markerMap[idx] = m;
  });
}

// Popup
let activeMarker = null;
let activeLabel = null;

function openPopup(v, idx) {
  // Remove pulse from previous marker
  if (activeMarker) {
    activeMarker.getElement()?.classList.remove('marker-pulse');
  }
  document.getElementById('pname').textContent = v.name;
  document.getElementById('pservice').textContent = [v.branch, v.era].filter(Boolean).join(' • ');
  document.getElementById('pstory').textContent = v.story || 'Service details being researched.';
  const photo = document.getElementById('pphoto');
  if (v.photo) {
    photo.src = v.photo;
    photo.style.display = 'block';
  } else {
    photo.style.display = 'none';
  }
  // Extra photos (newspaper clippings, documents, etc.)
  let extEl = document.getElementById('pextra');
  if (!extEl) {
    extEl = document.createElement('div');
    extEl.id = 'pextra';
    extEl.style.cssText = 'margin-bottom:10px;';
    photo.parentNode.insertBefore(extEl, photo.nextSibling);
  }
  extEl.innerHTML = '';
  if (v.extraPhotos && v.extraPhotos.length) {
    v.extraPhotos.forEach(ep => {
      const link = document.createElement('a');
      link.href = ep.src;
      link.target = '_blank';
      link.style.cssText = 'display:block;margin-bottom:10px;color:#c8b97a;font-size:0.82rem;text-decoration:none;border:1px solid #444;border-radius:6px;padding:8px 12px;background:#1a1a1a;';
      link.textContent = ep.caption || '📄 View document';
      extEl.appendChild(link);
    });
  }
  const flagsEl = document.getElementById('pflags');
  flagsEl.innerHTML = '';
  const fs = {'KIA':['#8B0000','#fff'],'Purple Heart':['#7B2D8B','#fff'],'Bronze Star':['#B8860B','#fff'],'Air Medal':['#1a6abf','#fff'],'Female Veteran':['#C71585','#fff']};
  (v.flags||[]).forEach(f => {
    const [bg,fg] = fs[f]||['#444','#fff'];
    const b = document.createElement('span');
    b.className='fbadge'; b.style.background=bg; b.style.color=fg; b.textContent=f;
    flagsEl.appendChild(b);
  });
  // Remove old label
  if (activeLabel) { map.removeLayer(activeLabel); activeLabel = null; }

  // Pulse the clicked marker
  const clickedMarker = markerMap[idx];
  if (clickedMarker) {
    clickedMarker.getElement()?.classList.add('marker-pulse');
    activeMarker = clickedMarker;
  }

  // Permanent coordinate + name label on the map
  activeLabel = L.popup({
    closeButton: false,
    autoPan: false,
    className: 'coord-label',
    offset: [15, 0]
  })
  .setLatLng([v.lat, v.lng])
  .setContent(`<div style="font-family:monospace;font-size:0.7rem;color:#f0e8d8;background:rgba(10,10,10,0.88);padding:5px 9px;border-radius:3px;border:1px solid #555;white-space:nowrap;"><strong style="font-family:Georgia,serif;font-size:0.75rem;">${v.name}</strong><br>${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}</div>`)
  .openOn(map);

  // Pan so grave appears in left half of screen, popup shows on right
  // Popup card is 310px wide, sitting at right:275px from edge
  // Grave should appear at roughly 30% from left edge
  const mapW = map.getContainer().offsetWidth;
  const popupLeft = mapW - 275 - 310; // left edge of popup card
  const graveTargetX = popupLeft * 0.45; // where we want the grave on screen
  const currentCenter = map.project(map.getCenter(), map.getZoom());
  const gravePoint = map.project([v.lat, v.lng], map.getZoom());
  const currentGraveX = gravePoint.x - currentCenter.x + mapW / 2;
  const shiftX = currentGraveX - graveTargetX;
  const newCenter = map.unproject([currentCenter.x + shiftX, currentCenter.y], map.getZoom());
  map.panTo(newCenter, {animate:true, duration:0.7});

  // Highlight sidebar
  document.querySelectorAll('.vet-item').forEach(el => el.classList.remove('active'));
  const si = document.querySelector(`.vet-item[data-i="${idx}"]`);
  if (si) { si.classList.add('active'); si.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  activeIdx = idx;
  document.getElementById('popup').classList.add('show');
}

function closePopup() {
  document.getElementById('popup').classList.remove('show');
  if (activeMarker) {
    activeMarker.getElement()?.classList.remove('marker-pulse');
    activeMarker = null;
  }
  if (activeLabel) { map.removeLayer(activeLabel); activeLabel = null; }
}
document.getElementById('popup').addEventListener('click', e => {
  if (e.target === document.getElementById('popup')) closePopup();
});
// Also close on map click when popup is open
map.on('click', () => {
  if (document.getElementById('popup').classList.contains('show')) closePopup();
});

// Sidebar
function buildSidebar() {
  const list = document.getElementById('vet-list');
  const none = document.getElementById('no-results');
  list.innerHTML = '';
  const term = searchTerm.toLowerCase();
  let shown = 0;
  const sorted = [...veterans].map((v,i)=>({...v,_i:i})).sort((a,b)=>{ const suf=/^(Sr|Jr|II|III|IV)\.?$/i; const wa=a.name.split(' '), wb=b.name.split(' '); const la=suf.test(wa[wa.length-1])?wa[wa.length-2]||wa[0]:wa[wa.length-1]; const lb=suf.test(wb[wb.length-1])?wb[wb.length-2]||wb[0]:wb[wb.length-1]; return la.localeCompare(lb)||a.name.localeCompare(b.name); });
  sorted.forEach((v) => { const idx = v._i;
    if (!activeEras.has(normEra(v.era))) return;
    if (term && !v.name.toLowerCase().includes(term) && !(v.branch||'').toLowerCase().includes(term)) return;
    shown++;
    const el = document.createElement('div');
    el.className = 'vet-item' + (idx===activeIdx?' active':'');
    el.dataset.i = idx;
    el.innerHTML = `<div class="v-sym" style="color:${eraColor(v.era)}">${branchSym(v.branch)}</div><div style="flex:1;min-width:0"><div class="v-name">${(()=>{const p=v.name.trim().split(/\s+/);const suf=/^(Sr|Jr|II|III|IV)\.?$/i;if(p.length>2&&suf.test(p[p.length-1])){return p[p.length-2]+', '+p.slice(0,-2).join(' ')+' '+p[p.length-1];}return p.length>1?p[p.length-1]+', '+p.slice(0,-1).join(' '):v.name;})()}</div><div class="v-era">${normEra(v.era)}</div></div>`;
    el.addEventListener('click', () => {
      map.flyTo([v.lat, v.lng], 19, {duration:1.0});
      setTimeout(() => openPopup(v, idx), 350);
    });
    list.appendChild(el);
  });
  none.style.display = shown===0 ? 'block' : 'none';
  document.getElementById('vet-count').textContent = `${veterans.length} Documented Veterans`;
}

// Era counts
const eraCounts = {};
veterans.forEach(v => {
  const e = normEra(v.era);
  eraCounts[e] = (eraCounts[e]||0)+1;
});

// Filter buttons
const filterDiv = document.getElementById('era-filters');
ERA_ORDER.forEach(era => {
  if (!eraCounts[era]) return;
  const color = ERA_COLORS[era];
  const short = era.replace(' Era','').replace('World War ','WW').replace('Korean War','Korea').replace('Spanish-American War','Span-Am');
  const btn = document.createElement('button');
  btn.className='era-btn on'; btn.style.background=color;
  btn.dataset.era=era; btn.textContent=short;
  btn.addEventListener('click', () => {
    if (activeEras.has(era)) {
      activeEras.delete(era);
      btn.classList.replace('on','off');
      document.querySelector(`.leg-row[data-era="${era}"]`)?.classList.add('dimmed');
    } else {
      activeEras.add(era);
      btn.classList.replace('off','on');
      document.querySelector(`.leg-row[data-era="${era}"]`)?.classList.remove('dimmed');
    }
    if (activeEras.size===0) {
      // Re-enable all instead of getting stuck
      ERA_ORDER.forEach(e => {
        activeEras.add(e);
        const b = document.querySelector(`.era-btn[data-era="${e}"]`);
        if (b) { b.classList.replace('off','on'); }
        document.querySelector(`.leg-row[data-era="${e}"]`)?.classList.remove('dimmed');
      });
    }
    buildMarkers(); buildSidebar();
  });
  filterDiv.appendChild(btn);
});

// Legend
const legRows = document.getElementById('leg-rows');
ERA_ORDER.forEach(era => {
  if (!eraCounts[era]) return;
  const row = document.createElement('div');
  row.className='leg-row'; row.dataset.era=era;
  row.innerHTML=`<div class="leg-sym" style="color:${ERA_COLORS[era]}">●</div><div class="leg-label">${era.replace(' Era','')}</div><div class="leg-count">${eraCounts[era]}</div>`;
  row.addEventListener('click', () => {
    document.querySelector(`.era-btn[data-era="${era}"]`)?.click();
  });
  legRows.appendChild(row);
});

// Search
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const term = e.target.value.toLowerCase();
    const match = veterans.find(v => v.name.toLowerCase().includes(term));
    if (match) {
      const idx = veterans.indexOf(match);
      map.flyTo([match.lat, match.lng], 19, {duration:1.0});
      setTimeout(() => openPopup(match, idx), 350);
    }
  }
});
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  buildSidebar();
});

buildMarkers();
buildSidebar();
</script>
</body>
</html>
