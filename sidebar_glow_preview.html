<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sidebar highlight preview</title>
<style>
  body { margin:0; padding:40px; background:#0a0a0a; font-family:Arial,sans-serif; display:flex; gap:50px; flex-wrap:wrap; }
  .col { width:265px; }
  .label { color:#888; font-size:13px; margin-bottom:10px; letter-spacing:0.03em; }
  .sidebar { background:rgba(10,10,10,0.93); border:1px solid #2a2a2a; border-radius:4px; padding:3px 0; }

  .vet-item { padding:8px 11px; cursor:pointer; border-bottom:1px solid #181818; display:flex; align-items:center; gap:7px; font-family:Georgia,serif; }
  .v-sym { font-size:0.85rem; width:15px; text-align:center; flex-shrink:0; }
  .v-name { font-size:0.82rem; color:#d4c9b8; flex:1; }
  .v-era { font-size:0.66rem; color:#777; }

  .demo-old .vet-item.active { background:#1e120a; border-left:3px solid #CD853F; padding-left:8px; }

  @keyframes candle-glow {
    0%, 100% { box-shadow: inset 0 0 14px rgba(205,133,63,0.12), 0 0 9px rgba(205,133,63,0.22); }
    50%      { box-shadow: inset 0 0 20px rgba(205,133,63,0.22), 0 0 15px rgba(205,133,63,0.4); }
  }
  .demo-new .vet-item.active {
    background: linear-gradient(90deg, rgba(205,133,63,0.16), rgba(20,12,7,0.97) 65%);
    border-left: 3px solid #CD853F;
    padding-left: 8px;
    animation: candle-glow 3.2s ease-in-out infinite;
  }
  .demo-new .vet-item.active .v-name { color:#f5e8d0; text-shadow:0 0 6px rgba(205,133,63,0.45); }
  .demo-new .vet-item.active .v-sym { text-shadow:0 0 6px rgba(205,133,63,0.65); }
  @media (prefers-reduced-motion: reduce) {
    .demo-new .vet-item.active { animation:none; box-shadow: inset 0 0 16px rgba(205,133,63,0.16), 0 0 11px rgba(205,133,63,0.3); }
  }
</style>
</head>
<body>

<div class="col">
  <div class="label">NOW — current highlight</div>
  <div class="sidebar demo-old">
    <div class="vet-item"><span class="v-sym">⚓</span><span class="v-name">J. Losty</span><span class="v-era">WWII</span></div>
    <div class="vet-item active"><span class="v-sym">✈</span><span class="v-name">L. Concannon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">★</span><span class="v-name">Mary Gordon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">✚</span><span class="v-name">Rev. W. Davitt</span><span class="v-era">WWI</span></div>
  </div>
</div>

<div class="col">
  <div class="label">NEW — candle glow</div>
  <div class="sidebar demo-new">
    <div class="vet-item"><span class="v-sym">⚓</span><span class="v-name">J. Losty</span><span class="v-era">WWII</span></div>
    <div class="vet-item active"><span class="v-sym">✈</span><span class="v-name">L. Concannon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">★</span><span class="v-name">Mary Gordon</span><span class="v-era">WWII</span></div>
    <div class="vet-item"><span class="v-sym">✚</span><span class="v-name">Rev. W. Davitt</span><span class="v-era">WWI</span></div>
  </div>
</div>

</body>
</html>
